[workspace]
members = [
    "crates/supvan-proto",
    "crates/supvan-cli",
    "crates/supvan-app",
]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
supvan-proto = { path = "crates/supvan-proto" }
# Path override until 0.9.0 is published — the media page and media_change
# hook this app relies on live there.
ipp-printer-app = { version = "0.9.0", path = "../ipp-printer-app" }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
bitflags = "2"
async-trait = "0.1"
tokio = { version = "1", default-features = false }

